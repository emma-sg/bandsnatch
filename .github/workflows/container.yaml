name: Container

# Publishes the image to GHCR so a NAS can pull a built image. Pull requests
# build without pushing, so a broken Dockerfile is caught before it reaches a tag.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/container.yaml
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read
  packages: write

env:
  # Not derived from `github.repository`: GHCR rejects uppercase in image names,
  # and that value preserves the case the repository was created with.
  IMAGE: ghcr.io/emma-sg/bandsnatch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 builds under emulation, which is slow for Rust, so only a tag
          # pays for it. Main-branch builds stay amd64-only.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations are off: they add manifests to the index that some
          # registry UIs, Unraid's included, fail to pull.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
